name: Delete subdomain

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "Subdomain to remove (e.g. 'lab')"
        required: true
        type: string
      confirm:
        description: "Retype the same name here to confirm"
        required: true
        type: string
      with_files:
        description: "Also delete the folder (it goes to the ~/.trash bin)"
        required: false
        type: boolean
        default: false
      purge:
        description: "With with_files only: PERMANENT deletion instead of the trash"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Print every call it would make, and make none"
        required: false
        type: boolean
        default: false

# Il job non usa il GITHUB_TOKEN: non gli serve nessuno scope.
permissions: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      # La conferma va verificata PRIMA di installare o eseguire qualsiasi cosa,
      # e senza interpolare gli input nello script: entrambi passano dall'env e
      # vengono confrontati da bash come stringhe.
      - name: Check the confirmation
        env:
          SUBDOMAIN: ${{ inputs.subdomain }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$SUBDOMAIN" != "$CONFIRM" ]; then
            echo "::error::The confirmation does not match the subdomain. Nothing was changed."
            echo "The 'confirm' field must repeat the name exactly."
            exit 1
          fi
          echo "Confirmation valid for '$SUBDOMAIN'."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Remove the subdomain
        env:
          # La cancellazione tocca solo cPanel: niente SERVER_IP, WHM o Namecheap.
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          SUBDOMAIN: ${{ inputs.subdomain }}
          WITH_FILES: ${{ inputs.with_files }}
          PURGE: ${{ inputs.purge }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=("$SUBDOMAIN" --delete)
          [ "$WITH_FILES" = "true" ] && ARGS+=(--with-files)
          [ "$PURGE" = "true" ] && ARGS+=(--purge)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python create_subdomain.py "${ARGS[@]}"
