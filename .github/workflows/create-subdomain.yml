name: Create subdomain

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "Nome del sottodominio (es. 'lab')"
        required: true
        type: string
      dry_run:
        description: "Mostra le chiamate senza eseguirle"
        required: false
        type: boolean
        default: false
      with_dns_api:
        description: "Crea anche un record DNS dedicato via Namecheap API"
        required: false
        type: boolean
        default: false
      skip_autossl:
        description: "Salta lo step AutoSSL"
        required: false
        type: boolean
        default: true
      skip_https_redirect:
        description: "Salta la scrittura del blocco .htaccess per l'HTTPS redirect"
        required: false
        type: boolean
        default: false

# Il job non usa il GITHUB_TOKEN: non gli serve nessuno scope.
permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Crea il sottodominio
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          # WHM: serve solo ad AutoSSL, saltato di default finché non c'è il token.
          WHM_HOST: ${{ secrets.WHM_HOST }}
          WHM_USER: ${{ secrets.WHM_USER }}
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          # Namecheap: serve solo con with_dns_api.
          NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
          # Gli input passano dall'ambiente, NON interpolati dentro lo script:
          # "${{ inputs.subdomain }}" verrebbe incollato prima che bash lo parsi,
          # e un valore tipo  x") ; comando ; ARGS=("y  eseguirebbe codice
          # arbitrario con tutti i secrets qui sopra nell'ambiente.
          SUBDOMAIN: ${{ inputs.subdomain }}
          DRY_RUN: ${{ inputs.dry_run }}
          WITH_DNS_API: ${{ inputs.with_dns_api }}
          SKIP_AUTOSSL: ${{ inputs.skip_autossl }}
          SKIP_HTTPS_REDIRECT: ${{ inputs.skip_https_redirect }}
        run: |
          ARGS=("$SUBDOMAIN")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$WITH_DNS_API" = "true" ] && ARGS+=(--with-dns-api)
          [ "$SKIP_AUTOSSL" = "true" ] && ARGS+=(--skip-autossl)
          [ "$SKIP_HTTPS_REDIRECT" = "true" ] && ARGS+=(--skip-https-redirect)
          python create_subdomain.py "${ARGS[@]}"
